plugins { id 'com.android.application' version '8.5.2' }
android {
    namespace 'com.almanasa.app'
    compileSdk 34
    defaultConfig { applicationId 'com.almanasa.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['java']; assets.srcDirs = ['assets'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
