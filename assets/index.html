<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1b8da6"><title>المنصة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--n:#0c1b2e;--n2:#17314f;--g:#c8a24a;--bg:#f3f4f7;--ln:#e2e6ee;--t:#5b6676}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--n)}button,input,select{font:inherit;color:inherit}button{border:0;cursor:pointer}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#app{max-width:1100px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.top{height:62px;border-radius:18px;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:0 10px 30px #0c1b2e33}
.brand{font-weight:800;font-size:19px;display:flex;gap:10px;align-items:center}.brand:before{content:'';width:4px;height:22px;border-radius:2px;background:var(--g)}
.ic{width:42px;height:42px;border-radius:12px;background:#ffffff14;color:#fff;font-size:19px;display:grid;place-items:center}
h2{font-size:25px;font-weight:800;margin:30px 0 4px}h2 i{font-style:normal}.sub{color:var(--t);margin:0 0 18px;font-size:15px}h3.sec{margin:28px 0 12px;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}.chip{border:1px solid var(--ln);background:#fff;padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;color:var(--n2)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}@media(max-width:560px){.g{grid-template-columns:1fr}}@media(min-width:900px){.g{grid-template-columns:repeat(3,1fr)}}
.c{background:#fff;border:1px solid var(--ln);border-radius:18px;overflow:hidden;box-shadow:0 2px 4px #0c1b2e0a,0 12px 28px #0c1b2e0d;display:flex;flex-direction:column;transition:transform .2s}.c:active{transform:scale(.985)}
.cv{aspect-ratio:16/9;background:linear-gradient(135deg,var(--n),var(--n2));color:var(--g);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}.cv img,.av img{width:100%;height:100%;object-fit:cover}
.cb{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}.cb h3{margin:0;font-size:18px;font-weight:800}.cb small{color:var(--t);font-size:13px}
.b{background:#fff;border:1px solid var(--n);color:var(--n);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;margin-top:auto}.b.s{background:var(--n);color:#fff}.b.r{border-color:#e3b4b4;color:#a33;min-height:36px;background:#fff7f7}
.t{display:flex;gap:14px;align-items:center}.av{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--n);color:var(--g);border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.pill{background:#f3f5f9;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:var(--t)}.pill b{min-width:30px;height:30px;background:var(--n);color:#fff;border-radius:9px;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#f3f5f9;border-radius:12px;text-align:center;padding:9px 2px;font-size:12px;color:var(--t)}.stats b{display:block;font-size:21px;color:var(--n)}
.hero{border-radius:24px;min-height:300px;background:linear-gradient(135deg,var(--n),var(--n2)) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:28px;margin-top:16px;border-bottom:3px solid var(--g);box-shadow:0 18px 40px #0c1b2e2e}.hero h1{margin:0;font-size:32px;font-weight:800;line-height:1.3;max-width:520px}.hero .b{width:fit-content;margin:0;background:var(--g);border-color:var(--g);color:var(--n)}
.e{grid-column:1/-1;text-align:center;padding:34px;border:1px dashed #b9c1ce;border-radius:16px;color:var(--t);background:#fff}
.row{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}.row>div{flex:1}.row b{display:block}.row small{color:var(--t)}.row>.i{width:40px;height:40px;padding:10px;border-radius:12px;background:var(--n);color:var(--g);stroke-width:1.6}
.nav{position:fixed;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px;max-width:560px;margin:auto;height:66px;background:var(--n);border-radius:22px;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;box-shadow:0 14px 34px #0c1b2e55}
.nav button{background:none;color:#8fa0b8;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}.nav .i{font-size:21px}.nav button.on{color:var(--g)}
.nav .hm{width:56px;height:56px;border-radius:50%;margin:-24px auto 0;background:var(--g);color:var(--n);justify-content:center;box-shadow:0 8px 20px #c8a24a66,0 0 0 5px var(--bg)}.nav .hm.on{color:var(--n)}.nav .hm .i{font-size:25px}
@media(min-width:900px){#app{padding-right:130px}.nav{top:14px;bottom:14px;right:14px;left:auto;width:90px;height:auto;max-width:none;margin:0;grid-template-columns:1fr;grid-template-rows:90px 1fr 1fr 1fr 1fr;border-radius:22px}.nav .hm{order:-1;margin:0 auto;box-shadow:0 8px 20px #c8a24a66}}
.ov{position:fixed;inset:0;z-index:50;background:#06101ccc;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sh{background:#fff;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px;display:grid;gap:12px}.sh h3{margin:0}.sh label{font-weight:700;font-size:14px;display:grid;gap:6px}
.f{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:#f8f9fb}
.pl{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}.ph{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.pb{flex:1;position:relative}.pb video,.pb iframe,.pb img{width:100%;height:100%;border:0;object-fit:contain;background:#000}
.wm{position:absolute;inset:-40px;display:flex;flex-wrap:wrap;gap:46px 40px;align-content:flex-start;justify-content:center;transform:rotate(-22deg);pointer-events:none;overflow:hidden;color:#fff;opacity:.2;font-weight:800;font-size:15px;animation:mv 14s linear infinite alternate}@keyframes mv{to{transform:rotate(-22deg) translate(60px,40px)}}
.hid #app,.hid .pl,.hid .nav{filter:blur(40px)}.hid:after{content:'';position:fixed;inset:0;background:#000;z-index:999}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;display:none;border-bottom:2px solid var(--g)}.toast.show{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{body{display:none!important}}
</style></head><body><svg width="0" height="0" style="position:absolute"><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H15v-6H9v6H3z"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5l5.5 3.5-5.5 3.5z"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 0 2 1h13v-3"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9M15 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM9 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol></svg>
<div id="app"><header class="top"><button class="ic" id="bk" onclick="history.back()"><svg class=i><use href=#i-arr></use></svg></button><div class="brand" id="br"></div><button class="ic" onclick="me()"><svg class=i><use href=#i-user></use></svg></button></header><main id="m"></main></div>
<nav class="nav"><button data-n="b" onclick="go('b')"><svg class=i><use href=#i-book></use></svg><span>الكتب</span></button><button data-n="v" onclick="go('v')"><svg class=i><use href=#i-play></use></svg><span>الفيديوهات</span></button><button class="hm" data-n="h" onclick="go('h')"><svg class=i><use href=#i-home></use></svg></button><button data-n="a" onclick="adm()"><svg class=i><use href=#i-shield></use></svg><span>الأدمن</span></button><button data-n="x" onclick="me()"><svg class=i><use href=#i-user></use></svg><span>ملفي</span></button></nav>
<div id="ov" class="ov" onclick="if(event.target==this)cl()"><div class="sh" id="sh"></div></div><div id="ts" class="toast"></div>
<script>
const $=s=>document.querySelector(s),K='alm3',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),go=h=>location.hash=h;
const D0=()=>({s:{name:'المنصة',wt:'أهلًا بك في المنصة',wi:'',pin:'',stu:'',sid:''},subjects:[],teachers:[],lectures:[],items:[],books:[]});
let db=D0(),ok=0;try{const j=JSON.parse(localStorage[K]);db={...db,...j,s:{...db.s,...j.s}}}catch(e){}
if(db.s.name=='المتميزون')db.s.name='المنصة';
const save=()=>{try{localStorage[K]=JSON.stringify(db)}catch(e){toast('المساحة ممتلئة، احذف صورًا قديمة')}render()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;const toast=t=>{const x=$('#ts');x.textContent=t;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),2200)};
const H=s=>{let h=5381;for(const c of s)h=h*33^c.charCodeAt(0);return''+(h>>>0)};
const idb=new Promise(r=>{const q=indexedDB.open('alm',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result)});
const kv=(m,k,v)=>idb.then(d=>new Promise(r=>{const s=d.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f'),q=m=='get'?s.get(k):m=='put'?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}));
const img=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const im=(u,e)=>u?`<img src="${u}" alt="">`:e;
const by=(a,k,v)=>db[a].filter(x=>x[k]==v),one=(a,i)=>db[a].find(x=>x.id==i);
const F={subjects:['مادة',[['name','اسم المادة'],['year','السنة'],['img','صورة المادة (الغلاف)','i']]],
teachers:['مدرس',[['name','اسم المدرس'],['subject','المادة','s:subjects'],['img','صورة المدرس','i']]],
lectures:['محاضرة / فصل',[['title','اسم المحتوى'],['teacher','المدرس','s:teachers'],['img','صورة المحاضرة','i']]],
items:['فيديو / ملف',[['title','العنوان'],['lecture','المحاضرة','s:lectures'],['kind','النوع','s:video,file'],['url','رابط (يوتيوب / درايف / مباشر)'],['file','أو ارفع ملف من جهازك','f']]],
books:['كتاب',[['name','اسم الكتاب'],['subject','المادة'],['year','السنة'],['img','صورة الغلاف','i'],['url','رابط PDF'],['file','أو ارفع ملف PDF','f']]],
s:['إعدادات المنصة',[['name','اسم المنصة'],['wt','عنوان الترحيب'],['wi','صورة الترحيب','i']]]};
function form(t){const[n,fs]=F[t];$('#sh').innerHTML=`<h3>${n}</h3>`+fs.map(([k,l,ty='t'])=>{let c;
if(ty=='i')c=`<input id="f_${k}" class="f" type="file" accept="image/*">`;else if(ty=='f')c=`<input id="f_${k}" class="f" type="file">`;
else if(ty[0]=='s'){const L=ty.slice(2),o=L.includes(',')?L.split(',').map(v=>[v,v=='video'?'فيديو':'ملف']):db[L].map(x=>[x.id,x.name||x.title]);c=`<select id="f_${k}" class="f">${o.map(([v,x])=>`<option value="${v}">${esc(x)}</option>`).join('')}</select>`}
else c=`<input id="f_${k}" class="f" value="${t=='s'?esc(db.s[k]):''}">`;return`<label>${l}${c}</label>`}).join('')+`<button class="b s" onclick="sub('${t}')">حفظ</button><button class="b" onclick="cl()">إلغاء</button>`;$('#ov').classList.add('show')}
async function sub(t){const fs=F[t][1],o={id:uid()};
for(const[k,,ty='t']of fs){const e=$('#f_'+k),f=e.files?.[0];if(ty=='i'){if(f)o[k]=await img(f)}else if(ty=='f'){if(f){await kv('put',o.id,f);o.fk=o.id;o.mime=f.type}}else o[k]=e.value.trim()}
if(t=='s'){for(const k in o)if(o[k]&&k!='id')db.s[k]=o[k];save();cl();return toast('تم الحفظ ✅')}
if(!o[fs[0][0]])return toast('اكتب '+fs[0][1]);if((t=='items'||t=='books')&&!o.url&&!o.fk)return toast('ضع رابطًا أو ارفع ملفًا');
if(o.url&&!/^https?:\/\//.test(o.url))return toast('الرابط لازم يبدأ بـ https://');
if(['teachers','lectures','items'].includes(t)&&!o[fs[1][0]])return toast('أضف '+fs[1][1]+' أولًا');
db[t].push(o);save();cl();toast('تمت الإضافة ✅')}
const cl=()=>{$('#ov').classList.remove('show');$('#sh').innerHTML=''};
function del(t,id){if(!confirm('تأكيد الحذف؟'))return;const x=one(t,id);if(x?.fk)kv('del',x.fk);db[t]=db[t].filter(y=>y.id!=id);save()}
async function play(id){const x=one('items',id)||one('books',id);let s=x.url||'';if(x.fk){const b=await kv('get',x.fk);if(b)s=URL.createObjectURL(b)}
const m=x.mime||'',yt=s.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/),dr=s.match(/drive\.google\.com\/file\/d\/([\w-]+)/);let h;
if(yt)h=`<iframe src="https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1&playsinline=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
else if(dr)h=`<iframe src="https://drive.google.com/file/d/${dr[1]}/preview"></iframe>`;
else if(m.startsWith('video')||x.kind=='video')h=`<video src="${s}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline></video>`;
else if(m.startsWith('image'))h=`<img src="${s}" alt="">`;else h=`<iframe src="${s}#toolbar=0&navpanes=0"></iframe>`;
const w=`${db.s.stu} • ${db.s.sid}`,d=document.createElement('div');d.className='pl';d.id='pl';
d.innerHTML=`<div class="ph"><b>${esc(x.title||x.name)}</b><button class="ic" onclick="document.getElementById('pl').remove()"><svg class=i><use href=#i-x></use></svg></button></div><div class="pb">${h}<div class="wm">${`<span>${esc(w)}</span>`.repeat(60)}</div></div>`;document.body.append(d)}
const card=(cv,small,h,body,btn)=>`<div class="c"><div class="cv">${cv}</div><div class="cb"><small>${small}</small><h3>${esc(h)}</h3>${body||''}${btn}</div></div>`,E=m=>`<div class="e">${m}</div>`;
function render(){const h=location.hash.slice(1)||'h',[v,id]=h.split('/');let o='';$('#br').textContent=db.s.name;$('#bk').style.visibility=v=='h'?'hidden':'visible';
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.n==({t:'v',l:'v',c:'v'}[v]||v)));
if(v=='h')o=`<div class="hero" style="${db.s.wi?`background-image:linear-gradient(#0003,#000b),url('${db.s.wi}')`:''}"><h1>${esc(db.s.wt)}</h1><button class="b" onclick="go('v')">ابدأ التعلم</button></div><div class="chips"><span class="chip"><svg class=i><use href=#i-book></use></svg> ${db.subjects.length} مادة</span><span class="chip"><svg class=i><use href=#i-play></use></svg> ${db.items.filter(i=>i.kind=='video').length} فيديو</span><span class="chip"><svg class=i><use href=#i-book></use></svg> ${db.books.length} كتاب</span></div>`+(db.items.length?'<h3 class=sec>أحدث المحتوى</h3>'+db.items.slice(-4).reverse().map(i=>`<div class=row><svg class=i><use href=#i-${i.kind=='video'?'play':'file'}></use></svg><div><b>${esc(i.title)}</b><small>${esc(one('lectures',i.lecture)?.title||'')}</small></div><button class="b s" onclick="play('${i.id}')">فتح</button></div>`).join(''):'');
else if(v=='v')o=`<h2>تصفح <i>المواد</i></h2><p class="sub">اختر المادة وابدأ المذاكرة.</p><div class="g">${db.subjects.map(s=>card(im(s.img,'<svg class=i><use href=#i-book></use></svg>'),esc(s.year),s.name,'',`<button class="b" onclick="go('t/${s.id}')">عرض مدرسين المادة</button>`)).join('')||E('لا توجد مواد بعد. الأدمن يضيفها من لوحة الأدمن.')}</div>`;
else if(v=='t'){const s=one('subjects',id);o=`<div class="chips"><span class="chip">${esc(s?.year)}</span><span class="chip">${esc(s?.name)}</span></div><h2>مدرسين <i>المادة</i></h2><p class="sub">اختر المدرس وشوف الفصول والمحاضرات.</p><div class="g">${by('teachers','subject',id).map(t=>`<div class="c"><div class="cb"><div class="t"><div class="av">${im(t.img,'<svg class=i><use href=#i-cap></use></svg>')}</div><div><small>مدرس المادة</small><h3>${esc(t.name)}</h3><small>${esc(s?.name)} • ${esc(s?.year)}</small></div></div><div class="pill">الفصول المتاحة<b>${by('lectures','teacher',t.id).length}</b></div><button class="b" onclick="go('l/${t.id}')">اكتشف الفصول</button></div></div>`).join('')||E('لا يوجد مدرسون لهذه المادة بعد.')}</div>`}
else if(v=='l'){const t=one('teachers',id);o=`<div class="chips"><span class="chip">${esc(t?.name)}</span></div><h2>محتوى <i>المحاضرات</i></h2><div class="g">${by('lectures','teacher',id).map((l,n)=>{const it=by('items','lecture',l.id),c=k=>it.filter(i=>i.kind==k).length;return`<div class="c"><div class="cb"><div class="t"><div class="av">${im(l.img,'<svg class=i><use href=#i-play></use></svg>')}</div><div><small>المحاضرة ${n+1}</small><h3>${esc(l.title)}</h3></div></div><div class="stats"><div><b>${c('video')}</b>فيديو</div><div><b>${c('file')}</b>ملف</div><div><b>${it.length}</b>الكل</div></div><button class="b" onclick="go('c/${l.id}')">محتوى المحاضرة</button></div></div>`}).join('')||E('لا توجد محاضرات بعد.')}</div>`}
else if(v=='c'){const l=one('lectures',id);o=`<h2>${esc(l?.title)}</h2><div style="margin-top:16px">${by('items','lecture',id).map(i=>`<div class="row"><span style="font-size:28px">${i.kind=='video'?'<svg class=i><use href=#i-play></use></svg>':'<svg class=i><use href=#i-file></use></svg>'}</span><div><b>${esc(i.title)}</b><small>${i.kind=='video'?'فيديو':'ملف'}</small></div><button class="b s" onclick="play('${i.id}')">فتح</button></div>`).join('')||E('لا يوجد محتوى بعد.')}</div>`}
else if(v=='b')o=`<h2>الكتب وملفات <i>PDF</i></h2><div class="g">${db.books.map(b=>card(im(b.img,'<svg class=i><use href=#i-book></use></svg>'),`${esc(b.subject)} • ${esc(b.year)}`,b.name,'',`<button class="b s" onclick="play('${b.id}')">قراءة</button>`)).join('')||E('لا توجد كتب بعد.')}</div>`;
else if(v=='a'){if(!ok)return go('h');o=`<h2>لوحة <i>الأدمن</i></h2><div class="chips">${Object.keys(F).map(k=>`<button class="b s" onclick="form('${k}')">${k=='s'?'<svg class=i><use href=#i-gear></use></svg>':'+'} ${F[k][0]}</button>`).join('')}</div>${['subjects','teachers','lectures','items','books'].flatMap(t=>db[t].map(x=>`<div class="row"><span style="font-size:24px">${{subjects:'<svg class=i><use href=#i-book></use></svg>',teachers:'<svg class=i><use href=#i-cap></use></svg>',lectures:'<svg class=i><use href=#i-layers></use></svg>',items:'<svg class=i><use href=#i-file></use></svg>',books:'<svg class=i><use href=#i-book></use></svg>'}[t]}</span><div><b>${esc(x.name||x.title)}</b></div><button class="b r" onclick="del('${t}','${x.id}')">حذف</button></div>`)).join('')||E('أضف أول مادة من الأزرار بالأعلى.')}`}
$('#m').innerHTML=o}
function adm(){if(!db.s.pin){const p=prompt('اختر رمز الأدمن (4 أحرف على الأقل)');if(!p||p.length<4)return;db.s.pin=H(p)}else if(H(prompt('رمز الأدمن')||'')!=db.s.pin)return toast('رمز غير صحيح');ok=1;save();go('a')}
function me(){const n=prompt('اسمك (يظهر كعلامة مائية على المحتوى)',db.s.stu);if(n){db.s.stu=n.trim().slice(0,20);save()}}
if(!db.s.sid){db.s.sid=uid().slice(-5).toUpperCase()}if(!db.s.stu)db.s.stu='طالب';
// الحماية
['contextmenu','copy','cut','dragstart'].forEach(e=>document.addEventListener(e,v=>v.preventDefault()));
const hid=v=>document.body.classList.toggle('hid',!!v);
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='printscreen'||(e.ctrlKey||e.metaKey)&&['p','s','c','u'].includes(k)||k=='f12'){e.preventDefault();navigator.clipboard?.writeText('').catch(()=>{});hid(1);setTimeout(()=>hid(0),1500)}});
document.addEventListener('keyup',e=>{if(e.key=='PrintScreen'){navigator.clipboard?.writeText('').catch(()=>{});hid(1);setTimeout(()=>hid(0),1500)}});
document.addEventListener('visibilitychange',()=>hid(document.hidden));addEventListener('pagehide',()=>hid(1));addEventListener('pageshow',()=>hid(0));
addEventListener('hashchange',()=>{if(document.getElementById('pl'))document.getElementById('pl').remove();render()});save();
</script></body></html>
